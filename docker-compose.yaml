services:
  osrm:
    build:
      dockerfile: Dockerfile.Osrm
    networks:
      - vroom-network
  vroom:
    build:
      dockerfile: Dockerfile.Vroom
    networks:
      - vroom-network
    ports:
      - "3000:3000"
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vroom-network
    restart: unless-stopped

networks:
  vroom-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: